; Builds the examples for ESP32-S3 boards (same family as the wand/target/BLE demos). Nothing here flashes anything.
;   pio run -e keys-demo        SessionlessKit only
;   pio run -e magic-demo       SessionlessKit + MagicCore
;   pio run -e magic-wand       a complete wand
;   pio run -e magic-gateway    a complete gateway (edit the CONFIG block, or pass -D WIFI_SSID=... via build_flags)
; To flash one yourself, add upload_port (`pio device list`) and run `pio run -e <env> -t upload`.
[platformio]
src_dir = examples

[env]
platform = espressif32
board = um_tinys3
framework = arduino
lib_extra_dirs = libs
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:keys-demo]
build_src_filter = -<*> +<keys-demo/>

[env:magic-demo]
build_src_filter = -<*> +<magic-demo/>

[env:magic-wand]
build_src_filter = -<*> +<magic-wand/>

[env:magic-gateway]
board = um_pros3
build_src_filter = -<*> +<magic-gateway/>
