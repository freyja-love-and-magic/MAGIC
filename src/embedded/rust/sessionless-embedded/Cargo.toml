[workspace]
exclude = ["size-probe"]

[package]
name = "sessionless-embedded"
version = "0.1.0"
edition = "2021"
description = "no_std Sessionless keys for microcontrollers: create, save, sign, verify"
license = "MIT"

[features]
default = []
std = ["k256/std", "sha3/std", "rand_core/std"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
